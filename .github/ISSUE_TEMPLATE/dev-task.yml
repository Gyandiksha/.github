name: "Development Task"
description: Create a technical task for Frontend, Backend, API, or DB work
title: "[TASK]: "
labels: ["Dev Task"]
body:
  - type: input
    id: parent
    attributes:
      label: Parent Issue
      description: "The Story this task belongs to, e.g. #63 or a full issue URL."
    validations:
      required: true
  - type: dropdown
    id: task_type
    attributes:
      label: Task Type
      options:
        - Frontend
        - Backend
        - API
        - Database (DB)
        - Infrastructure / DevOps
    validations:
      required: true
  - type: input
    id: accountable_person
    attributes:
      label: Accountable Person
      description: "@mention the person ultimately accountable (Lead / Architect). Use Assignees for the Responsible Person."
  - type: input
    id: estimate
    attributes:
      label: Estimated Effort (Hours)
      placeholder: e.g. 6
  - type: textarea
    id: description
    attributes:
      label: Technical Description & Action Items
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Blockers & Dependencies
      description: APIs, DB migrations (e.g., Flyway), or pending PRs needed first.
