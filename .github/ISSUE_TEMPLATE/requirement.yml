name: "Requirement Specification"
description: Define an Epic, Feature, Sub-Feature, or User Story
title: "[REQ]: "
labels: ["Requirement"]
body:
  - type: markdown
    attributes:
      value: "Requirement details for the Ucchha-Shiksha Samiksha Kendra project. Hierarchy: Epic → Feature → Sub-Feature → Story → Task."
  - type: dropdown
    id: level
    attributes:
      label: Level
      options:
        - Epic
        - Feature
        - Sub-Feature
        - Story
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Parent Issue
      description: "The Epic / Feature / Sub-Feature this belongs to, e.g. #63 or a full issue URL. Leave empty for an Epic."
  - type: input
    id: project_version
    attributes:
      label: Project Version
      placeholder: e.g. v1.0
  - type: dropdown
    id: requirement_type
    attributes:
      label: Requirement Type
      options:
        - Functional
        - Non-Functional
  - type: input
    id: roles
    attributes:
      label: Authorized Roles
      description: Who can access or execute this? (e.g., Admin, Student, Faculty)
  - type: textarea
    id: business_rules
    attributes:
      label: Business Rules / Detailed Description
    validations:
      required: true
  - type: textarea
    id: preconditions
    attributes:
      label: Preconditions
      description: What state must the system be in?
  - type: textarea
    id: trigger
    attributes:
      label: Trigger / Event
      description: What event starts this?
  - type: textarea
    id: inputs
    attributes:
      label: Inputs / Fields
  - type: textarea
    id: validations
    attributes:
      label: Validation Rules
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: What defines this requirement as complete?
    validations:
      required: true
  - type: textarea
    id: action_items
    attributes:
      label: Action Items
  - type: input
    id: ui_reference
    attributes:
      label: UI Rules / Figma Reference
  - type: textarea
    id: workflow
    attributes:
      label: Workflow / Process Flow
  - type: textarea
    id: expected_result
    attributes:
      label: Expected Result / Outputs
  - type: textarea
    id: alternate_scenario
    attributes:
      label: Alternate / Exception Scenarios
  - type: input
    id: consulted
    attributes:
      label: Consulted
      description: Who must be consulted? (@mentions)
  - type: input
    id: informed
    attributes:
      label: Informed
      description: Who must be informed? (@mentions)
  - type: checkboxes
    id: communication
    attributes:
      label: Stakeholder Communication
      options:
        - label: Consulted phase completed
        - label: Informed phase completed
