name: "Bug Report"
description: Report a defect found during testing
title: "[BUG]: "
labels: ["Bug"]
body:
  - type: input
    id: parent
    attributes:
      label: Parent Issue
      description: "The Task (or its Test Case) where the bug was found, e.g. #64 or a full issue URL."
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical
        - Major
        - Minor
        - Trivial
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low
  - type: dropdown
    id: testing_category
    attributes:
      label: Testing Category
      options:
        - Functional
        - Non-Functional
        - UI/UX
        - Performance / Load
        - Security
    validations:
      required: true
  - type: input
    id: test_scenario
    attributes:
      label: Test Scenario / Test Case Reference
  - type: textarea
    id: environment
    attributes:
      label: Environment / Configuration
      placeholder: e.g., Staging, Chrome v118, PostgreSQL 15
    validations:
      required: true
  - type: textarea
    id: test_steps
    attributes:
      label: Steps to Reproduce & Preconditions
    validations:
      required: true
  - type: textarea
    id: test_data
    attributes:
      label: Test Data / Input
  - type: textarea
    id: expected_result
    attributes:
      label: Expected Result
    validations:
      required: true
  - type: textarea
    id: actual_result
    attributes:
      label: Actual Result
    validations:
      required: true
  - type: input
    id: attachment
    attributes:
      label: Attachment Link
      description: Screenshots, recordings, or logs (e.g., Grafana/Dozzle links).
